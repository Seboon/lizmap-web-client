registration.body.html=<p>Kaixo,</p>\n\n\
<p><em>"{$user->login|eschtml}"</em> kontua sortuz, <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a> gunean izena eman berri duzu.</p>\n\n\
<p>Zure kontua erabili aurretik, izen-ematea berretsi behar duzu \n\
<a href="{$confirmation_link}">esteka honetan klik eginez</a>. Esteka hau {$validationKeyTTL} baliozkoa da.</p>\n\n\
<p>Laster arte {$domain_name}{$basePath}(e)n!</p>
registration.admin.resend.link.activation.body.html=<p>Kaixo,</p>\n\n\
<p>Kontu honentzako <em>"{$user->login}"</em> aktibazio-gako berri bat eskatu berri duzu.</p>\n\n\
<p> Egin <a href="{$confirmation_link}">klik esteka honetan</a> zure izen-ematea berresteko. Esteka hau {$validationKeyTTL} baliozkoa da.</p>\n\n\
<p>Laster arte {$domain_name}{$basePath}(e)n!</p>
registration.subject=Zure kontuaren aktibazioa %s webgunean
registration.admin.body.html=<p>Kaixo,</p>\n\n\
<p><a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a> webguneko administratzaileak\n\
kontu bat sortu dizu, <em>"{$user->login|eschtml}"</em> erabiltzaile-izenarekin.</p>\n\n\
<p>Zure kontua erabili aurretik, izen-ematea berretsi behar duzu \n\
<a href="{$confirmation_link}">esteka honetan klik eginez</a>, \n\
eta ondoren pasahitz berri bat adieraziz. Esteka hau {$validationKeyTTL} baliozkoa da.</p>\n\n\
<p>Ikusi arte {$domain_name}{$basePath} gunean!</p>
password.reset.subject=Zure pasahitzaren berrezarpena %s webgunean
password.reset.body.html=<p>Kaixo,</p>\n\n\
<p><em>"{$user->login|eschtml}"</em> kontuaren pasahitza berrezartzeko eskaera egin duzu\n\
<a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a> webgunean.</p>\n\n\
<p>Benetan aldatu nahi baduzu, <a href="{$confirmation_link}">esteka honetan klik egin</a> behar duzu.</p>\n\n\
<p>Ondoren zure konturako pasahitz berri bat ezarri ahalko duzu. Esteka hau {$validationKeyTTL} baliozkoa da.</p>\n\n\
<p>Eskaera hau errore bat bada edo ez baduzu berretsi nahi, ez ikusi egin mezu honi.\n\
Zure pasahitza ez da aldatuko.</p>\n\n\
<p>Ikusi arte {$domain_name}{$basePath} gunean!</p>
password.admin.reset.subject=Zure pasahitzaren berrezarpena %s webgunean
password.admin.reset.body.html=<p>Kaixo,</p>\n\n\
<p><a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a> webguneko administratzaileak\n\
mezu hau bidali dizu <em>"{$user->login}"</em> kontuaren pasahitza alda dezazun.</p>\n\n\
<p>Aldaketa berretsi nahi baduzu, <a href="{$confirmation_link}">esteka honetan klik egin</a> behar duzu.</p>\n\n\
<p>Ondoren zure konturako pasahitz berri bat ezarri ahalko duzu. Esteka hau {$validationKeyTTL} baliozkoa da.</p>\n\n\
<p>Eskaera hau errore bat bada edo ez baduzu berretsi nahi, ez ikusi egin mezu honi,\n\
eta zure pasahitza ez da aldatuko.</p>\n\n\
<p>Ikusi arte {$domain_name}{$basePath} gunean!</p>
account.change.notification.subject=%s erabiltzailearen profilean aldaketak %s webgunean
account.change.notification.body.html=<p>Kaixo,</p>\n\n\
<p>{$userName} erabiltzaileak aldaketa batzuk egin ditu <a href="{$profilLink}">bere profilean</a>.</p><p>Agur.</p>
