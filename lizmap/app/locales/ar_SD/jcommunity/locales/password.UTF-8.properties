form.text.html=<p>إذا نسيت كلمة مرورك، أدخل أدناه اسم الدخول والبريد الإلكتروني الذي أدخلته في ملفك الشخصي عند التسجيل.</p> <p>سيتم إرسال بريد إلكتروني إليك مع رابط إلى صفحة تتيح لك اختيار كلمة مرور جديدة.</p>
