waiting.text.html=<p>تم إرسال بريد إلكتروني إليك على العنوان المحدد. إذا لم تجده في صندوق بريدك خلال بضع دقائق، تحقق من مجلد الرسائل غير المرغوب فيها. إذا لم تستلم البريد، فربما يكون اسم المستخدم أو العنوان الذي أدخلته غير صالحين. تواصل مع مسؤول الموقع.</p> <p>يحتوي هذا البريد على رابط إلى صفحة تتيح لك تغيير كلمة المرور. هذا الرابط صالح لبضع ساعات.</p> <p>ما لم\
تقم بتغيير كلمة المرور، تبقى القديمة صالحة.</p>
