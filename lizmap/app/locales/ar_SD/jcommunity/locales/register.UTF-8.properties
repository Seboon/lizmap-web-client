registration.waiting.title=إنشاء حسابك
registration.waiting.text.html= <p>تم إنشاء حسابك للتو. ولكن قبل أن تتمكن من استخدامه، يجب علينا تفعيله والتحقق أولاً من عنوان بريدك الإلكتروني.</p><p>للقيام\
 بذلك، يجب عليك النقر على الرابط الموجود في <strong>البريد الإلكتروني الذي أرسلناه إليك للتو</strong>. تحقق من مجلد الرسائل غير المرغوب فيها إذا لم تجده في\
 صندوق بريدك خلال بضع دقائق.</p>
