cmdline.import.help.description=استيراد مستخدمين من ملف CSV
cmdline.import.help.text=يمكن أن يقابل كل حقل من ملف CSV خاصية من خصائص الحساب. يجب عليك تحديد ترتيب الحقول باستخدام المعامل fields.\n\
على سبيل المثال، عندما يحتوي كل سطر من ملف CSV على معرّف وتاريخ ميلاد وعنوان بريد إلكتروني،\n\
وأن الحقول الممكنة هي فقط login وemail (أي تجاهل تاريخ الميلاد)، يجب عليك \nتحديد المعامل fields بالقيمة 'login,,email' (لا يوجد اسم للحقل الثاني الذي يقابل\n\
تاريخالميلاد المتجاهل).\nمثال على الأمر: php console.php jcommunity~user:import accounts.csv "login,,email"
cmdline.import.help.parameter.csvfile=مسار ملف CSV المراد استيراده
cmdline.import.help.parameter.fields=قائمة الحقول المراد استيرادها، مفصولة بفواصل.\nأدخل قيمة فارغة أو _ignore_ لتجاهل حقل.\n\
يمكن أن يحتوي الحقل _role_ على دور المستخدم الخاص بـ ACL.\nقائمة الحقول الممكنة: %s
