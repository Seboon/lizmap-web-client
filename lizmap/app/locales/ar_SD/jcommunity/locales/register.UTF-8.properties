admin.resend.email.title=التسجيل: إعادة إرسال بريد تفعيل
admin.resend.email.text.html=<p>سيتم إرسال بريد إلكتروني بمفتاح تفعيل جديد إلى المستخدم '%s' الذي لديه حساب غير مفعَّل.\n\
استخدم هذه الوظيفة إذا أبلغك المستخدم بأن المفتاح الذي استلمه قد انتهت صلاحيته.</p>
admin.resend.email.done.text.html=<p>تم إرسال البريد الإلكتروني إلى المستخدم.</p>
cmdline.create.help.usage=php cmdline.php jcommunity~user:create [-v] [--admin] [--reset] login email [password]
cmdline.create.help.description=ينشئ مستخدمًا جديدًا
cmdline.create.help.text=يمكن تحديد كلمة المرور أو توليدها عشوائيًا، أو يمكن إرسال بريد إلكتروني ليختارها المستخدم بنفسه.\n\
إذا كان المستخدم موجودًا بالفعل، يتم عرض خطأ، إلا إذا تم تمرير الخيار '--no-error-if-exists'.
