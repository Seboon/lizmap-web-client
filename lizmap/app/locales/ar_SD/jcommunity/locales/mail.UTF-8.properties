<p>عندها يمكنك إدخال كلمة مرور جديدة. هذا الرابط صالح لمدة {$validationKeyTTL}.</p>\n\n\
<p>إذا كان طلب إعادةالتعيين هذا خطأً، تجاهل هذه الرسالة،\nوستظل كلمة مرورك الحالية صالحة.</p>\n\n<p>إلى اللقاء على {$domain_name}{$basePath}‏ !</p>
account.change.notification.subject=تعديل ملف %s الشخصي على الموقع %s
account.change.notification.body.html=<p>مرحبًا،</p>\n\n<p>قام المستخدم {$userName} بإجراء تعديلات <a href="{$profilLink}">في ملفه الشخصي</a>.</p>\n\
<p>إلى اللقاء.</p>


