registration.subject=تفعيل حسابك على الموقع %s
registration.body.html=<p>مرحبًا،</p>\n\n<p>لقد قمت للتو بالتسجيل في الموقع <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a> عن\
 طريق إنشاء الحساب <em>"{$user->login|eschtml}"</em> .</p>\n\n\
<p>لاستخدام حسابك، يجب عليك أولاً تأكيد تسجيلك\n<a href="{$confirmation_link}">بالنقر على هذا الرابط</a>. هذا الرابط صالح لمدة {$validationKeyTTL}.</p>\n\n\
<p>إلى اللقاء على {$domain_name}{$basePath}‏ !</p>
registration.admin.body.html=<p>مرحبًا،</p>\n\n<p>قام مسؤول الموقع <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>\n\
بإنشاء حساب لك معرّفه هو <em>"{$user->login|eschtml}"</em>.</p>\n\n\
<p>لتفعيل حسابك، يجب عليك <a href="{$confirmation_link}">النقر على هذا الرابط</a>\nلإدخال كلمة مرور جديدة. هذا الرابط صالح لمدة {$validationKeyTTL}.</p>\n\n\
<p>إلى اللقاء على {$domain_name}{$basePath}‏ !</p>
password.reset.subject=إعادة تعيين كلمة مرورك على الموقع %s
password.reset.body.html=<p>مرحبًا،</p>\n\n<p>لقد طلبت للتو إعادة تعيين كلمة مرور\n\
حسابك <em>"{$user->login|eschtml}"</em> على الموقع <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>.</p>\n\n\
<p>إذا كنت تريد تأكيد إعادة التعيين هذه، <a href="{$confirmation_link}">انقر على هذا الرابط</a>.</p>\n\n\
<p>عندها يمكنك تغيير كلمة المرور. هذا الرابط صالح لمدة {$validationKeyTTL}.</p>\n\n\
<p>إذا كان طلب إعادةالتعيين هذا خطأً، تجاهل هذه الرسالة،\nوستظل كلمة مرورك الحالية صالحة.</p>\n\n<p>إلى اللقاء على {$domain_name}{$basePath}‏ !</p>
