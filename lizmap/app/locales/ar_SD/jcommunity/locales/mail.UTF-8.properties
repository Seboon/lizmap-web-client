registration.admin.resend.link.activation.body.html=<p>مرحبًا،</p>\n\n<p>لقد طلبت للتو مفتاح تفعيل جديدًا لحسابك <em>"{$user->login}"</em>.</p>\n\n\
<p><a href="{$confirmation_link}">انقر على هذا الرابط</a> لتأكيد تسجيلك. هذا الرابط صالح لمدة {$validationKeyTTL}.</p>\n\n\
<p>إلى اللقاء على {$domain_name}{$basePath}‏ !</p>
