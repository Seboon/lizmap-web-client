registration.body.html=<p>Hei,</p>\n\n\
<p>Rekisteröidyit juuri sivustolle <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a> luomalla tilin <em>"{$user->login|eschtml}"</em> .</p>\n\n\
<p>Ennen kuin käytät tiliäsi, sinun tulee vahvistaa rekisteröitymisesi \n\
<a href="{$confirmation_link}">napsauttamalla tätä linkkiä</a>. Tämä linkki on voimassa {$validationKeyTTL}.</p>\n\n\
<p>Nähdään pian sivustolla {$domain_name}{$basePath}!</p>
registration.admin.resend.link.activation.body.html=<p>Hei,</p>\n\n\
<p>Pyysit juuri uutta aktivointiavainta tilillesi <em>"{$user->login}"</em>.</p>\n\n\
<p> <a href="{$confirmation_link}">Napsauta tätä linkkiä</a> vahvistaaksesi rekisteröitymisesi. Tämä linkki on voimassa {$validationKeyTTL}.</p>\n\n\
<p>Nähdään pian sivustolla {$domain_name}{$basePath}!</p>
registration.subject=Tilisi aktivointi sivustolla %s
registration.admin.body.html=<p>Hei,</p>\n\n\
<p>Sivuston <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a> ylläpitäjä\n\
on luonut sinulle tilin, käyttäjätunnuksella <em>"{$user->login|eschtml}"</em>.</p>\n\n\
<p>Ennen kuin voit käyttää tiliäsi, sinun tulee vahvistaa rekisteröitymisesi \n\
<a href="{$confirmation_link}">napsauttamalla tätä linkkiä</a> \n\
ja antamalla sitten uuden salasanan. Tämä linkki on voimassa {$validationKeyTTL}.</p>\n\n\
<p>Nähdään sivustolla {$domain_name}{$basePath}!</p>
password.reset.subject=Salasanasi palautus sivustolla %s
password.reset.body.html=<p>Hei,</p>\n\n\
<p>Pyysit salasanan palautusta tilillesi <em>"{$user->login|eschtml}"</em>\n\
sivustolla <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>.</p>\n\n\
<p>Jos todella haluat vaihtaa sen, sinun tulee <a href="{$confirmation_link}">napsauttaa tätä linkkiä</a>.</p>\n\n\
<p>Voit sitten asettaa tilillesi uuden salasanan. Tämä linkki on voimassa {$validationKeyTTL}.</p>\n\n\
<p>Jos tämä pyyntö on virhe tai et halua vahvistaa sitä, jätä tämä viesti huomiotta.\n\
Salasanaasi ei muuteta.</p>\n\n\
<p>Nähdään sivustolla {$domain_name}{$basePath}!</p>
password.admin.reset.subject=Salasanasi palautus sivustolla %s
password.admin.reset.body.html=<p>Hei,</p>\n\n\
<p>Sivuston <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a> ylläpitäjä\n\
on lähettänyt sinulle tämän viestin, jotta voit vaihtaa tilisi <em>"{$user->login}"</em> salasanan.</p>\n\n\
<p>Jos haluat vahvistaa muutoksen, sinun tulee <a href="{$confirmation_link}">napsauttaa tätä linkkiä</a>.</p>\n\n\
<p>Voit sitten asettaa tilillesi uuden salasanan. Tämä linkki on voimassa {$validationKeyTTL}.</p>\n\n\
<p>Jos tämä pyyntö on virhe tai et halua vahvistaa sitä, jätä tämä viesti huomiotta,\n\
eikä salasanaasi muuteta.</p>\n\n\
<p>Nähdään sivustolla {$domain_name}{$basePath}!</p>
account.change.notification.subject=Muutoksia käyttäjän %s profiiliin sivustolla %s
account.change.notification.body.html=<p>Hei,</p>\n\n\
<p>Käyttäjä {$userName} on tehnyt muutoksia <a href="{$profilLink}">profiiliinsa</a>.</p><p>Terveisin.</p>
