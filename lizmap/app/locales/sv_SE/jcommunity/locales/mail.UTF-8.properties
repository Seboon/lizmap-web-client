registration.body.html=<p>Hej,</p>\n\n\
<p>Du har just registrerat dig på webbplatsen <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a> genom att skapa kontot <em>"{$user->login|eschtml}"</em> .</p>\n\n\
<p>Innan du använder ditt konto måste du bekräfta din registrering \n\
<a href="{$confirmation_link}">genom att klicka på den här länken</a>. Länken är giltig {$validationKeyTTL}.</p>\n\n\
<p>Vi ses snart på {$domain_name}{$basePath}!</p>
registration.admin.resend.link.activation.body.html=<p>Hej,</p>\n\n\
<p>Du har just begärt en ny aktiveringsnyckel för ditt konto <em>"{$user->login}"</em>.</p>\n\n\
<p> <a href="{$confirmation_link}">Klicka på den här länken</a> för att bekräfta din registrering. Länken är giltig {$validationKeyTTL}.</p>\n\n\
<p>Vi ses snart på {$domain_name}{$basePath}!</p>
registration.subject=Aktivering av ditt konto på webbplatsen %s
registration.admin.body.html=<p>Hej,</p>\n\n\
<p>Administratören för webbplatsen <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>\n\
har skapat ett konto åt dig, med användarnamnet <em>"{$user->login|eschtml}"</em>.</p>\n\n\
<p>Innan du kan använda ditt konto måste du bekräfta din registrering \n\
<a href="{$confirmation_link}">genom att klicka på den här länken</a>, \n\
och sedan ange ett nytt lösenord. Länken är giltig {$validationKeyTTL}.</p>\n\n\
<p>Vi ses på {$domain_name}{$basePath}!</p>
password.reset.subject=Återställning av ditt lösenord på webbplatsen %s
password.reset.body.html=<p>Hej,</p>\n\n\
<p>Du har begärt en återställning av lösenordet för ditt konto <em>"{$user->login|eschtml}"</em>\n\
på webbplatsen <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>.</p>\n\n\
<p>Om du verkligen vill ändra det måste du <a href="{$confirmation_link}">klicka på den här länken</a>.</p>\n\n\
<p>Du kan sedan ange ett nytt lösenord för ditt konto. Länken är giltig {$validationKeyTTL}.</p>\n\n\
<p>Om denna begäran är ett misstag eller om du inte vill bekräfta den, bortse från detta meddelande.\n\
Ditt lösenord kommer inte att ändras.</p>\n\n\
<p>Vi ses på {$domain_name}{$basePath}!</p>
password.admin.reset.subject=Återställning av ditt lösenord på webbplatsen %s
password.admin.reset.body.html=<p>Hej,</p>\n\n\
<p>Administratören för webbplatsen <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>\n\
har skickat detta meddelande till dig så att du kan ändra lösenordet för kontot <em>"{$user->login}"</em>.</p>\n\n\
<p>Om du vill bekräfta ändringen måste du <a href="{$confirmation_link}">klicka på den här länken</a>.</p>\n\n\
<p>Du kan sedan ange ett nytt lösenord för ditt konto. Länken är giltig {$validationKeyTTL}.</p>\n\n\
<p>Om denna begäran är ett misstag eller om du inte vill bekräfta den, bortse från detta meddelande,\n\
och ditt lösenord kommer inte att ändras.</p>\n\n\
<p>Vi ses på {$domain_name}{$basePath}!</p>
account.change.notification.subject=Ändringar i profilen för %s på webbplatsen %s
account.change.notification.body.html=<p>Hej,</p>\n\n\
<p>Användaren {$userName} har gjort några ändringar <a href="{$profilLink}">i sin profil</a>.</p><p>Med vänliga hälsningar.</p>
