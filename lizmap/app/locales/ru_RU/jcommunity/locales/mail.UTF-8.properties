registration.body.html=<p>Здравствуйте,</p>\n\n\
<p>Вы только что зарегистрировались на сайте <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>, создав учётную запись <em>"{$user->login|eschtml}"</em> .</p>\n\n\
<p>Прежде чем использовать свою учётную запись, вам необходимо подтвердить регистрацию \n\
<a href="{$confirmation_link}">, перейдя по этой ссылке</a>. Эта ссылка действительна {$validationKeyTTL}.</p>\n\n\
<p>До скорой встречи на {$domain_name}{$basePath}!</p>
registration.admin.resend.link.activation.body.html=<p>Здравствуйте,</p>\n\n\
<p>Вы только что запросили новый ключ активации для вашей учётной записи <em>"{$user->login}"</em>.</p>\n\n\
<p> <a href="{$confirmation_link}">Перейдите по этой ссылке</a>, чтобы подтвердить регистрацию. Эта ссылка действительна {$validationKeyTTL}.</p>\n\n\
<p>До скорой встречи на {$domain_name}{$basePath}!</p>
registration.subject=Активация вашей учётной записи на сайте %s
registration.admin.body.html=<p>Здравствуйте,</p>\n\n\
<p>Администратор сайта <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>\n\
создал для вас учётную запись с логином <em>"{$user->login|eschtml}"</em>.</p>\n\n\
<p>Прежде чем использовать свою учётную запись, вы должны подтвердить регистрацию, \n\
<a href="{$confirmation_link}">перейдя по этой ссылке</a>, \n\
а затем указав новый пароль. Эта ссылка действительна {$validationKeyTTL}.</p>\n\n\
<p>До встречи на {$domain_name}{$basePath}!</p>
password.reset.subject=Сброс вашего пароля на сайте %s
password.reset.body.html=<p>Здравствуйте,</p>\n\n\
<p>Вы запросили сброс пароля для вашей учётной записи <em>"{$user->login|eschtml}"</em>\n\
на сайте <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>.</p>\n\n\
<p>Если вы действительно хотите его изменить, вам нужно <a href="{$confirmation_link}">перейти по этой ссылке</a>.</p>\n\n\
<p>Затем вы сможете установить новый пароль для вашей учётной записи. Эта ссылка действительна {$validationKeyTTL}.</p>\n\n\
<p>Если этот запрос является ошибкой или вы не хотите его подтверждать, проигнорируйте это письмо.\n\
Ваш пароль не будет изменён.</p>\n\n\
<p>До встречи на {$domain_name}{$basePath}!</p>
password.admin.reset.subject=Сброс вашего пароля на сайте %s
password.admin.reset.body.html=<p>Здравствуйте,</p>\n\n\
<p>Администратор сайта <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>\n\
отправил вам это письмо, чтобы вы могли изменить пароль для учётной записи <em>"{$user->login}"</em>.</p>\n\n\
<p>Если вы хотите подтвердить изменение, вам нужно <a href="{$confirmation_link}">перейти по этой ссылке</a>.</p>\n\n\
<p>Затем вы сможете установить новый пароль для вашей учётной записи. Эта ссылка действительна {$validationKeyTTL}.</p>\n\n\
<p>Если этот запрос является ошибкой или вы не хотите его подтверждать, проигнорируйте это письмо,\n\
и ваш пароль не будет изменён.</p>\n\n\
<p>До встречи на {$domain_name}{$basePath}!</p>
account.change.notification.subject=Изменения в профиле %s на сайте %s
account.change.notification.body.html=<p>Здравствуйте,</p>\n\n\
<p>Пользователь {$userName} внёс изменения <a href="{$profilLink}">в свой профиль</a>.</p><p>С уважением.</p>
