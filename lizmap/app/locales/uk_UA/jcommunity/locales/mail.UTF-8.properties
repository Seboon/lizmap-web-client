registration.subject=Активація вашої облікової сторінки на веб сайті %s
registration.body.html=<p>Доброго дня,</p>\n\n\
<p>Ви створили новий обліковий запис на <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>.</p>\n\n\
<p>Перед тим як використовувати свій обліковий запис, ви маєте підтвердити свою реєстрацію\n\
<a href="{$confirmation_link}">перейдіть за посиланням</a>. Посилання дійсне {$validationKeyTTL}.</p>\n\n\
<p>До зустрічі {$domain_name}{$basePath}!</p>
#Modified registration.body.html=<p>Вітаємо,</p>\n\n<p>Ви щойно зареєструвалися на сайті <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>,\
#  створивши обліковий запис <em>"{$user->login|eschtml}"</em> .</p>\n\n\
# <a href="{$confirmation_link}">, перейшовши за цим посиланням</a>. Це посилання дійсне {$validationKeyTTL}.</p>\n\n
registration.admin.body.html=<p>Доброго дня,</p>\n\n<p>Адміністратор веб сайту <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}3</a>\n\
для вас була створена облікова сторінка з логіном<em>"{$user->login|eschtml}"</em>.</p>\n\n\
<p>Перед тим як використовувати вашу облікову сторінку, ви маєте підтвердити вашу реєстрацію\n<a href="{$confirmation_link}">перейшовши за посиланням</a>,\n\
а потів вказавши новий пароль. Посилання дійсне {$validationKeyTTL}.</p>\n\n<p>До зустрічі{$domain_name}{$basePath}!</p>
password.reset.subject=Скинути пароль на веб сайті %s
password.reset.body.html=<p>Доброго дня,</p>\n\n<p>Ви надіслали запит на скидання паролю до вашої облікової сторінки <em>"{$user->login|eschtml}"</em>\n\
на веб сайті <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>.</p>\n\n\
<p>Якщо Ви насправді бажаєте змінити його, Вам потрібно <a href="{$confirmation_link}">перейти за посиланням</a>.</p>\n\n\
<p>Потім ви можете встановити новий пароль для свого облікового запису. Посилання дійсне {$validationKeyTTL}.</p>\n\n\
<p>Якщо цейзапит є помилкою або ви не хочете підтверджувати, проігноруйте це повідомлення,\nІ ваш пароль не буде змінено.</p>\n\n\
<p>До зустрічі {$domain_name}{$basePath}!</p>
password.admin.reset.subject=Скинути пароль на веб сайті %s
password.admin.reset.body.html=<p>Доброго дня,</p>\n<p>Адміністратор веб сторінки <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>\n\
Вам було надіслано електронного листа, щоб ви могли змінити свій пароль для облікової сторінки <em>"{$user->login}"</em>.</p>\n\n\
<p>Якщо Ви бажаєте підтвердити змінити, вам необхідно <a href="{$confirmation_link}">натиснути на це посилання </a>.</p>\n\n\
<p>Потім Ви зможете  встановити новий пароль до вашої облікової сторінки. Посиланнядійсне {$validationKeyTTL}.</p>\n\n\
<p>Якщо цей запит є помилкою або ви не хочете підтверджувати, проігноруйте це повідомлення,\nі Ваш пароль не буде змінено.</p>\n\n\
<p>До зустрічі {$domain_name}{$basePath}!</p>
account.change.notification.subject=Changes into the profile of %s on the web site %s
account.change.notification.body.html=<p>Hello,</p>\n\n <p>The user {$userName} has made some changes <a href="{$profilLink}">into his profile</a>.</p>\
 <p>Regards.</p>

