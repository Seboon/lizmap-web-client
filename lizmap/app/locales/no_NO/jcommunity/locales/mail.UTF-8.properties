registration.body.html=<p>Hei,</p>\n\n\
<p>Du har nettopp registrert deg på nettstedet <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a> ved å opprette kontoen <em>"{$user->login|eschtml}"</em> .</p>\n\n\
<p>Før du bruker kontoen din, må du bekrefte registreringen din \n\
<a href="{$confirmation_link}">ved å klikke på denne lenken</a>. Denne lenken er gyldig {$validationKeyTTL}.</p>\n\n\
<p>Vi sees snart på {$domain_name}{$basePath}!</p>
registration.admin.resend.link.activation.body.html=<p>Hei,</p>\n\n\
<p>Du har nettopp bedt om en ny aktiveringsnøkkel for kontoen din <em>"{$user->login}"</em>.</p>\n\n\
<p> <a href="{$confirmation_link}">Klikk på denne lenken</a> for å bekrefte registreringen din. Denne lenken er gyldig {$validationKeyTTL}.</p>\n\n\
<p>Vi sees snart på {$domain_name}{$basePath}!</p>
registration.subject=Aktivering av kontoen din på nettstedet %s
registration.admin.body.html=<p>Hei,</p>\n\n\
<p>Administratoren av nettstedet <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>\n\
har opprettet en konto for deg, med brukernavnet <em>"{$user->login|eschtml}"</em>.</p>\n\n\
<p>Før du kan bruke kontoen din, må du bekrefte registreringen \n\
<a href="{$confirmation_link}">ved å klikke på denne lenken</a>, \n\
og deretter angi et nytt passord. Denne lenken er gyldig {$validationKeyTTL}.</p>\n\n\
<p>Vi sees på {$domain_name}{$basePath}!</p>
password.reset.subject=Tilbakestilling av passordet ditt på nettstedet %s
password.reset.body.html=<p>Hei,</p>\n\n\
<p>Du har bedt om å tilbakestille passordet for kontoen din <em>"{$user->login|eschtml}"</em>\n\
på nettstedet <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>.</p>\n\n\
<p>Hvis du virkelig ønsker å endre det, må du <a href="{$confirmation_link}">klikke på denne lenken</a>.</p>\n\n\
<p>Deretter kan du angi et nytt passord for kontoen din. Denne lenken er gyldig {$validationKeyTTL}.</p>\n\n\
<p>Hvis denne forespørselen er en feil eller du ikke ønsker å bekrefte den, kan du ignorere denne e-posten.\n\
Passordet ditt vil ikke bli endret.</p>\n\n\
<p>Vi sees på {$domain_name}{$basePath}!</p>
password.admin.reset.subject=Tilbakestilling av passordet ditt på nettstedet %s
password.admin.reset.body.html=<p>Hei,</p>\n\n\
<p>Administratoren av nettstedet <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>\n\
har sendt deg denne e-posten slik at du kan endre passordet for kontoen <em>"{$user->login}"</em>.</p>\n\n\
<p>Hvis du ønsker å bekrefte endringen, må du <a href="{$confirmation_link}">klikke på denne lenken</a>.</p>\n\n\
<p>Deretter kan du angi et nytt passord for kontoen din. Denne lenken er gyldig {$validationKeyTTL}.</p>\n\n\
<p>Hvis denne forespørselen er en feil eller du ikke ønsker å bekrefte den, kan du ignorere denne e-posten,\n\
og passordet ditt vil ikke bli endret.</p>\n\n\
<p>Vi sees på {$domain_name}{$basePath}!</p>
account.change.notification.subject=Endringer i profilen til %s på nettstedet %s
account.change.notification.body.html=<p>Hei,</p>\n\n\
<p>Brukeren {$userName} har gjort noen endringer <a href="{$profilLink}">i profilen sin</a>.</p><p>Med vennlig hilsen.</p>
