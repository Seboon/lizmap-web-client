registration.body.html=<p>Γεια σας,</p>\n\n\
<p>Μόλις εγγραφήκατε στον ιστότοπο <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a> δημιουργώντας τον λογαριασμό <em>"{$user->login|eschtml}"</em> .</p>\n\n\
<p>Πριν χρησιμοποιήσετε τον λογαριασμό σας, θα πρέπει να επιβεβαιώσετε την εγγραφή σας \n\
<a href="{$confirmation_link}">κάνοντας κλικ σε αυτόν τον σύνδεσμο</a>. Αυτός ο σύνδεσμος ισχύει {$validationKeyTTL}.</p>\n\n\
<p>Τα λέμε σύντομα στο {$domain_name}{$basePath}!</p>
registration.admin.resend.link.activation.body.html=<p>Γεια σας,</p>\n\n\
<p>Μόλις ζητήσατε ένα νέο κλειδί ενεργοποίησης για τον λογαριασμό σας <em>"{$user->login}"</em>.</p>\n\n\
<p> <a href="{$confirmation_link}">Κάντε κλικ σε αυτόν τον σύνδεσμο</a> για να επιβεβαιώσετε την εγγραφή σας. Αυτός ο σύνδεσμος ισχύει {$validationKeyTTL}.</p>\n\n\
<p>Τα λέμε σύντομα στο {$domain_name}{$basePath}!</p>
registration.subject=Ενεργοποίηση του λογαριασμού σας στον ιστότοπο %s
registration.admin.body.html=<p>Γεια σας,</p>\n\n\
<p>Ο διαχειριστής του ιστότοπου <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>\n\
δημιούργησε έναν λογαριασμό για εσάς, με όνομα χρήστη <em>"{$user->login|eschtml}"</em>.</p>\n\n\
<p>Πριν χρησιμοποιήσετε τον λογαριασμό σας, πρέπει να επιβεβαιώσετε την εγγραφή σας \n\
<a href="{$confirmation_link}">κάνοντας κλικ σε αυτόν τον σύνδεσμο</a>, \n\
και στη συνέχεια να ορίσετε νέο κωδικό πρόσβασης. Αυτός ο σύνδεσμος ισχύει {$validationKeyTTL}.</p>\n\n\
<p>Τα λέμε στο {$domain_name}{$basePath}!</p>
password.reset.subject=Επαναφορά του κωδικού πρόσβασής σας στον ιστότοπο %s
password.reset.body.html=<p>Γεια σας,</p>\n\n\
<p>Ζητήσατε επαναφορά κωδικού πρόσβασης για τον λογαριασμό σας <em>"{$user->login|eschtml}"</em>\n\
στον ιστότοπο <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>.</p>\n\n\
<p>Αν πράγματι θέλετε να τον αλλάξετε, πρέπει να <a href="{$confirmation_link}">κάνετε κλικ σε αυτόν τον σύνδεσμο</a>.</p>\n\n\
<p>Στη συνέχεια θα μπορέσετε να ορίσετε νέο κωδικό πρόσβασης για τον λογαριασμό σας. Αυτός ο σύνδεσμος ισχύει {$validationKeyTTL}.</p>\n\n\
<p>Αν αυτό το αίτημα οφείλεται σε λάθος ή δεν θέλετε να το επιβεβαιώσετε, αγνοήστε αυτό το μήνυμα.\n\
Ο κωδικός πρόσβασής σας δεν θα αλλάξει.</p>\n\n\
<p>Τα λέμε στο {$domain_name}{$basePath}!</p>
password.admin.reset.subject=Επαναφορά του κωδικού πρόσβασής σας στον ιστότοπο %s
password.admin.reset.body.html=<p>Γεια σας,</p>\n\n\
<p>Ο διαχειριστής του ιστότοπου <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>\n\
σας έστειλε αυτό το μήνυμα ώστε να μπορέσετε να αλλάξετε τον κωδικό πρόσβασης για τον λογαριασμό <em>"{$user->login}"</em>.</p>\n\n\
<p>Αν θέλετε να επιβεβαιώσετε την αλλαγή, πρέπει να <a href="{$confirmation_link}">κάνετε κλικ σε αυτόν τον σύνδεσμο</a>.</p>\n\n\
<p>Στη συνέχεια θα μπορέσετε να ορίσετε νέο κωδικό πρόσβασης για τον λογαριασμό σας. Αυτός ο σύνδεσμος ισχύει {$validationKeyTTL}.</p>\n\n\
<p>Αν αυτό το αίτημα οφείλεται σε λάθος ή δεν θέλετε να το επιβεβαιώσετε, αγνοήστε αυτό το μήνυμα,\n\
και ο κωδικός πρόσβασής σας δεν θα αλλάξει.</p>\n\n\
<p>Τα λέμε στο {$domain_name}{$basePath}!</p>
account.change.notification.subject=Αλλαγές στο προφίλ του %s στον ιστότοπο %s
account.change.notification.body.html=<p>Γεια σας,</p>\n\n\
<p>Ο χρήστης {$userName} έκανε κάποιες αλλαγές <a href="{$profilLink}">στο προφίλ του</a>.</p><p>Με εκτίμηση.</p>
