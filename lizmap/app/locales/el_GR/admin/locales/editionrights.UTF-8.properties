section.title=Επεξεργασία ανά αποθετήριο και ανά έργο
section.intro=Δικαίωμα «Χρήση του εργαλείου επεξεργασίας» αυτού του χρήστη, αποθετήριο προς αποθετήριο. Το «Όλα τα έργα» ισχύει και για έργα που προστίθενται αργότερα. Οι επιτρεπόμενες ομάδες κάθε επεξεργάσιμου επιπέδου (πρόσθετο Lizmap) ελέγχονται στη συνέχεια.
