registration.body.html=<p>Pozdravljeni,</p>\n\n\
<p>Pravkar ste se registrirali na spletnem mestu <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a> z ustvarjanjem računa <em>"{$user->login|eschtml}"</em> .</p>\n\n\
<p>Preden uporabite svoj račun, morate potrditi registracijo \n\
<a href="{$confirmation_link}">s klikom na to povezavo</a>. Ta povezava je veljavna {$validationKeyTTL}.</p>\n\n\
<p>Se vidimo kmalu na {$domain_name}{$basePath}!</p>
registration.admin.resend.link.activation.body.html=<p>Pozdravljeni,</p>\n\n\
<p>Pravkar ste zahtevali nov aktivacijski ključ za svoj račun <em>"{$user->login}"</em>.</p>\n\n\
<p> <a href="{$confirmation_link}">Kliknite na to povezavo</a>, da potrdite registracijo. Ta povezava je veljavna {$validationKeyTTL}.</p>\n\n\
<p>Se vidimo kmalu na {$domain_name}{$basePath}!</p>
registration.subject=Aktivacija vašega računa na spletnem mestu %s
registration.admin.body.html=<p>Pozdravljeni,</p>\n\n\
<p>Skrbnik spletnega mesta <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>\n\
vam je ustvaril račun z uporabniškim imenom <em>"{$user->login|eschtml}"</em>.</p>\n\n\
<p>Preden lahko uporabite svoj račun, morate potrditi registracijo \n\
<a href="{$confirmation_link}">s klikom na to povezavo</a> \n\
in nato vnesti novo geslo. Ta povezava je veljavna {$validationKeyTTL}.</p>\n\n\
<p>Se vidimo na {$domain_name}{$basePath}!</p>
password.reset.subject=Ponastavitev vašega gesla na spletnem mestu %s
password.reset.body.html=<p>Pozdravljeni,</p>\n\n\
<p>Zahtevali ste ponastavitev gesla za svoj račun <em>"{$user->login|eschtml}"</em>\n\
na spletnem mestu <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>.</p>\n\n\
<p>Če ga res želite spremeniti, morate <a href="{$confirmation_link}">klikniti na to povezavo</a>.</p>\n\n\
<p>Nato boste lahko nastavili novo geslo za svoj račun. Ta povezava je veljavna {$validationKeyTTL}.</p>\n\n\
<p>Če je ta zahteva napaka ali je ne želite potrditi, prezrite to sporočilo.\n\
Vaše geslo ne bo spremenjeno.</p>\n\n\
<p>Se vidimo na {$domain_name}{$basePath}!</p>
password.admin.reset.subject=Ponastavitev vašega gesla na spletnem mestu %s
password.admin.reset.body.html=<p>Pozdravljeni,</p>\n\n\
<p>Skrbnik spletnega mesta <a href="{$website_uri}" class="notexpandlink">{$domain_name}{$basePath}</a>\n\
vam je poslal to sporočilo, da lahko spremenite geslo za račun <em>"{$user->login}"</em>.</p>\n\n\
<p>Če želite potrditi spremembo, morate <a href="{$confirmation_link}">klikniti na to povezavo</a>.</p>\n\n\
<p>Nato boste lahko nastavili novo geslo za svoj račun. Ta povezava je veljavna {$validationKeyTTL}.</p>\n\n\
<p>Če je ta zahteva napaka ali je ne želite potrditi, prezrite to sporočilo,\n\
vaše geslo pa ne bo spremenjeno.</p>\n\n\
<p>Se vidimo na {$domain_name}{$basePath}!</p>
account.change.notification.subject=Spremembe v profilu uporabnika %s na spletnem mestu %s
account.change.notification.body.html=<p>Pozdravljeni,</p>\n\n\
<p>Uporabnik {$userName} je naredil nekaj sprememb <a href="{$profilLink}">v svojem profilu</a>.</p><p>Lep pozdrav.</p>
